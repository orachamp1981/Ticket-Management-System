<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ticket tracker</title>
<style>
  :root{
    --line: #e4e4e0;
    --ink: #1f1e1a;
    --ink-soft: #6b6a63;
    --ink-faint: #9a9992;
    --danger: #a83b3b;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:#fff;
    color:var(--ink);
    padding:32px 20px 60px;
  }
  .wrap{max-width:900px;margin:0 auto;}

  .top{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    gap:16px;
    margin-bottom:20px;
    flex-wrap:wrap;
  }
  .top h1{
    font-size:22px;
    font-weight:600;
    margin:0 0 4px;
  }
  .top p{margin:0;color:var(--ink-soft);font-size:13.5px;}
  .new-btn{
    background:none;
    color:var(--ink);
    border:1px solid var(--line);
    padding:8px 14px;
    font-size:13.5px;
    font-weight:600;
    cursor:pointer;
    white-space:nowrap;
  }
  .new-btn:hover{border-color:var(--ink-faint);}

  .metrics{
    display:flex;
    gap:24px;
    padding:14px 0;
    border-top:1px solid var(--line);
    border-bottom:1px solid var(--line);
    margin-bottom:18px;
    flex-wrap:wrap;
  }
  .metric .num{font-size:18px;font-weight:600;}
  .metric .label{font-size:12.5px;color:var(--ink-soft);}
  .metric{display:flex;align-items:baseline;gap:6px;}

  .filters{
    display:flex;
    gap:8px;
    margin-bottom:14px;
    flex-wrap:wrap;
    align-items:center;
  }
  .filters select, .filters input{
    border:none;
    border-bottom:1px solid var(--line);
    background:none;
    padding:5px 2px;
    font-size:13.5px;
    color:var(--ink);
  }
  .filters input[type="text"]{flex:1;min-width:160px;}
  .filters select{cursor:pointer;}
  .filters select:focus, .filters input:focus{outline:none;border-bottom-color:var(--ink);}

  .board{display:flex;flex-direction:column;}

  .ticket{
    border-bottom:1px solid var(--line);
    padding:12px 0;
    display:grid;
    grid-template-columns:1fr auto;
    gap:10px;
    cursor:pointer;
  }
  .t-main{min-width:0;}
  .t-top-row{display:flex;align-items:center;gap:10px;margin-bottom:3px;flex-wrap:wrap;}
  .t-client{font-weight:600;font-size:14px;}
  .t-cat{font-size:12px;color:var(--ink-faint);}
  .t-title{font-size:13.5px;color:var(--ink-soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .t-meta{display:flex;gap:14px;margin-top:6px;font-size:12px;color:var(--ink-faint);flex-wrap:wrap;}
  .t-right{display:flex;flex-direction:column;align-items:flex-end;gap:6px;white-space:nowrap;}

  .pill{
    font-size:12px;
    font-weight:600;
    color:var(--ink-soft);
  }
  .pri-critical{color:var(--danger);}
  .pri-high{color:var(--ink);}
  .pri-medium{color:var(--ink-soft);}
  .pri-low{color:var(--ink-faint);}

  .status-select{
    border:none;
    border-bottom:1px solid var(--line);
    font-size:12.5px;
    padding:3px 0;
    background:none;
    color:var(--ink);
  }
  .status-select:focus{outline:none;border-bottom-color:var(--ink);}

  .empty{
    text-align:center;
    padding:60px 20px;
    color:var(--ink-soft);
  }
  .empty h3{margin:0 0 6px;font-size:15px;color:var(--ink);font-weight:600;}

  .overlay{
    position:fixed;inset:0;
    background:rgba(30,28,22,0.3);
    display:none;
    align-items:flex-start;
    justify-content:center;
    padding:40px 16px;
    overflow-y:auto;
    z-index:50;
  }
  .overlay.show{display:flex;}
  .modal{
    background:#fff;
    padding:24px;
    width:100%;
    max-width:460px;
    border:1px solid var(--line);
  }
  .modal h2{margin:0 0 18px;font-size:16px;font-weight:600;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12.5px;color:var(--ink-soft);margin-bottom:4px;font-weight:600;}
  .field input, .field select, .field textarea{
    width:100%;
    border:none;
    border-bottom:1px solid var(--line);
    padding:7px 2px;
    font-size:14px;
    font-family:inherit;
    color:var(--ink);
    background:none;
  }
  .field input:focus, .field select:focus, .field textarea:focus{outline:none;border-bottom-color:var(--ink);}
  .field textarea{resize:vertical;min-height:56px;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .modal-actions{
    display:flex;justify-content:space-between;align-items:center;
    margin-top:20px;
  }
  .btn{
    border:none;background:none;padding:8px 4px;font-size:13.5px;font-weight:600;cursor:pointer;
  }
  .btn-primary{color:var(--ink);border-bottom:1px solid var(--ink);}
  .btn-primary:hover{color:#3a3830;}
  .btn-ghost{color:var(--ink-soft);}
  .btn-ghost:hover{color:var(--ink);}
  .btn-danger-text{color:var(--danger);font-size:13px;}
  .error-text{color:var(--danger);font-size:12.5px;margin-top:4px;display:none;}

  .loading{text-align:center;padding:40px;color:var(--ink-faint);font-size:14px;}

  @media (max-width:640px){
    .ticket{grid-template-columns:1fr;}
    .t-right{flex-direction:row;align-items:center;justify-content:space-between;}
    .metrics{gap:16px;}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div>
      <h1>Ticket tracker</h1>
      <p>Shared with your whole team — every request, one place.</p>
    </div>
    <button class="new-btn" id="newBtn">New ticket</button>
  </div>

  <div class="metrics" id="metrics"></div>

  <div class="filters">
    <input type="text" id="searchInput" placeholder="Search client or title...">
    <select id="statusFilter">
      <option value="all">All statuses</option>
      <option value="Open">Open</option>
      <option value="In Progress">In progress</option>
      <option value="Waiting on Client">Waiting on client</option>
      <option value="Closed">Closed</option>
    </select>
    <select id="priorityFilter">
      <option value="all">All priorities</option>
      <option value="Critical">Critical</option>
      <option value="High">High</option>
      <option value="Medium">Medium</option>
      <option value="Low">Low</option>
    </select>
    <select id="categoryFilter">
      <option value="all">All types</option>
      <option value="Client Support">Client support</option>
      <option value="Task/Bug">Task / bug</option>
    </select>
    <select id="sortBy">
      <option value="priority">Sort: priority</option>
      <option value="due">Sort: due date</option>
      <option value="recent">Sort: most recent</option>
    </select>
  </div>

  <div id="loading" class="loading">Loading tickets…</div>
  <div class="board" id="board" style="display:none;"></div>
</div>

<div class="overlay" id="overlay">
  <div class="modal">
    <h2 id="modalTitle">New ticket</h2>
    <form id="ticketForm">
      <div class="field">
        <label>Client name</label>
        <input type="text" id="f_client" placeholder="Acme Corp">
        <div class="error-text" id="err_client">Enter a client name.</div>
      </div>
      <div class="field">
        <label>Title / description</label>
        <textarea id="f_title" placeholder="What's the request?"></textarea>
        <div class="error-text" id="err_title">Enter a title or description.</div>
      </div>
      <div class="row2">
        <div class="field">
          <label>Type</label>
          <select id="f_category">
            <option>Client Support</option>
            <option>Task/Bug</option>
          </select>
        </div>
        <div class="field">
          <label>Priority</label>
          <select id="f_priority">
            <option>Critical</option>
            <option>High</option>
            <option selected>Medium</option>
            <option>Low</option>
          </select>
        </div>
      </div>
      <div class="row2">
        <div class="field">
          <label>Owner</label>
          <input type="text" id="f_owner" placeholder="Who's handling this">
        </div>
        <div class="field">
          <label>Due date</label>
          <input type="date" id="f_due">
        </div>
      </div>
      <div class="field">
        <label>Status</label>
        <select id="f_status">
          <option>Open</option>
          <option>In Progress</option>
          <option>Waiting on Client</option>
          <option>Closed</option>
        </select>
      </div>
      <div class="modal-actions">
        <div>
          <button type="button" class="btn btn-danger-text" id="deleteBtn" style="display:none;">Delete ticket</button>
        </div>
        <div style="display:flex;gap:8px;">
          <button type="button" class="btn btn-ghost" id="cancelBtn">Cancel</button>
          <button type="submit" class="btn btn-primary" id="saveBtn">Save ticket</button>
        </div>
      </div>
    </form>
  </div>
</div>

<script>
let tickets = [];
let editingId = null;
const STORAGE_KEY = 'tickets';

const board = document.getElementById('board');
const loading = document.getElementById('loading');
const overlay = document.getElementById('overlay');
const form = document.getElementById('ticketForm');

function uid(){ return 't_' + Date.now() + '_' + Math.random().toString(36).slice(2,8); }

async function loadTickets(){
  loading.style.display = 'block';
  board.style.display = 'none';
  try{
    const res = await window.storage.get(STORAGE_KEY, true);
    tickets = res && res.value ? JSON.parse(res.value) : [];
  }catch(e){
    tickets = [];
  }
  loading.style.display = 'none';
  board.style.display = 'flex';
  render();
}

// Poll for changes made by teammates so the board stays live without manual refresh.
async function refreshFromRemote(){
  if(overlay.classList.contains('show')) return; // don't yank data out from under an open form
  try{
    const res = await window.storage.get(STORAGE_KEY, true);
    const remote = res && res.value ? JSON.parse(res.value) : [];
    if(JSON.stringify(remote) !== JSON.stringify(tickets)){
      tickets = remote;
      render();
    }
  }catch(e){
    // Silent fail — keep showing last known state rather than interrupting the user.
  }
}
setInterval(refreshFromRemote, 4000);

async function saveTickets(){
  try{
    await window.storage.set(STORAGE_KEY, JSON.stringify(tickets), true);
  }catch(e){
    console.error('Storage error', e);
  }
}

function priorityRank(p){
  return {Critical:0, High:1, Medium:2, Low:3}[p] ?? 4;
}

function statusPillColor(status){
  if(status === 'Closed') return 'pri-low';
  if(status === 'Waiting on Client') return 'pri-medium';
  if(status === 'In Progress') return 'pri-high';
  return 'pri-critical';
}

function renderMetrics(){
  const open = tickets.filter(t=>t.status==='Open').length;
  const progress = tickets.filter(t=>t.status==='In Progress').length;
  const waiting = tickets.filter(t=>t.status==='Waiting on Client').length;
  const critical = tickets.filter(t=>t.priority==='Critical' && t.status!=='Closed').length;
  const metrics = document.getElementById('metrics');
  metrics.innerHTML = `
    <div class="metric"><div class="num">${open}</div><div class="label">Open</div></div>
    <div class="metric"><div class="num">${progress}</div><div class="label">In progress</div></div>
    <div class="metric"><div class="num">${waiting}</div><div class="label">Waiting on client</div></div>
    <div class="metric"><div class="num">${critical}</div><div class="label">Critical (unresolved)</div></div>
  `;
}

function escapeHtml(s){
  return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function render(){
  renderMetrics();
  const search = document.getElementById('searchInput').value.toLowerCase();
  const statusF = document.getElementById('statusFilter').value;
  const prioF = document.getElementById('priorityFilter').value;
  const catF = document.getElementById('categoryFilter').value;
  const sortBy = document.getElementById('sortBy').value;

  let filtered = tickets.filter(t=>{
    if(statusF !== 'all' && t.status !== statusF) return false;
    if(prioF !== 'all' && t.priority !== prioF) return false;
    if(catF !== 'all' && t.category !== catF) return false;
    if(search){
      const hay = (t.client + ' ' + t.title).toLowerCase();
      if(!hay.includes(search)) return false;
    }
    return true;
  });

  filtered.sort((a,b)=>{
    if(sortBy === 'priority') return priorityRank(a.priority) - priorityRank(b.priority);
    if(sortBy === 'due') return (a.due || '9999') > (b.due || '9999') ? 1 : -1;
    return b.createdAt - a.createdAt;
  });

  if(filtered.length === 0){
    board.innerHTML = `<div class="empty"><h3>No tickets here</h3><p>Create a ticket to get your team's queue started.</p></div>`;
    return;
  }

  board.innerHTML = filtered.map(t => `
    <div class="ticket" data-id="${t.id}">
      <div class="t-main">
        <div class="t-top-row">
          <span class="t-client">${escapeHtml(t.client)}</span>
          <span class="t-cat">${escapeHtml(t.category)}</span>
          <span class="pill ${'pri-' + t.priority.toLowerCase()}">${t.priority}</span>
        </div>
        <div class="t-title">${escapeHtml(t.title)}</div>
        <div class="t-meta">
          <span>${t.owner ? 'Owner: ' + escapeHtml(t.owner) : 'Unassigned'}</span>
          <span>${t.due ? 'Due ' + t.due : 'No due date'}</span>
        </div>
      </div>
      <div class="t-right">
        <select class="status-select" data-id="${t.id}">
          <option ${t.status==='Open'?'selected':''}>Open</option>
          <option ${t.status==='In Progress'?'selected':''}>In Progress</option>
          <option ${t.status==='Waiting on Client'?'selected':''}>Waiting on Client</option>
          <option ${t.status==='Closed'?'selected':''}>Closed</option>
        </select>
      </div>
    </div>
  `).join('');

  board.querySelectorAll('.ticket').forEach(el=>{
    el.addEventListener('click', (e)=>{
      if(e.target.classList.contains('status-select')) return;
      openModal(el.dataset.id);
    });
  });
  board.querySelectorAll('.status-select').forEach(sel=>{
    sel.addEventListener('click', e=>e.stopPropagation());
    sel.addEventListener('change', async (e)=>{
      const id = e.target.dataset.id;
      const t = tickets.find(x=>x.id===id);
      if(t){ t.status = e.target.value; await saveTickets(); render(); }
    });
  });
}

function openModal(id){
  editingId = id || null;
  const t = id ? tickets.find(x=>x.id===id) : null;
  document.getElementById('modalTitle').textContent = t ? 'Edit ticket' : 'New ticket';
  document.getElementById('f_client').value = t ? t.client : '';
  document.getElementById('f_title').value = t ? t.title : '';
  document.getElementById('f_category').value = t ? t.category : 'Client Support';
  document.getElementById('f_priority').value = t ? t.priority : 'Medium';
  document.getElementById('f_owner').value = t ? (t.owner || '') : '';
  document.getElementById('f_due').value = t ? (t.due || '') : '';
  document.getElementById('f_status').value = t ? t.status : 'Open';
  document.getElementById('deleteBtn').style.display = t ? 'inline-block' : 'none';
  document.getElementById('err_client').style.display = 'none';
  document.getElementById('err_title').style.display = 'none';
  overlay.classList.add('show');
}

function closeModal(){
  overlay.classList.remove('show');
  editingId = null;
}

document.getElementById('newBtn').addEventListener('click', ()=>openModal(null));
document.getElementById('cancelBtn').addEventListener('click', closeModal);
overlay.addEventListener('click', (e)=>{ if(e.target === overlay) closeModal(); });

document.getElementById('deleteBtn').addEventListener('click', async ()=>{
  if(editingId){
    tickets = tickets.filter(t=>t.id !== editingId);
    await saveTickets();
    closeModal();
    render();
  }
});

form.addEventListener('submit', async (e)=>{
  e.preventDefault();
  const client = document.getElementById('f_client').value.trim();
  const title = document.getElementById('f_title').value.trim();
  let valid = true;
  if(!client){ document.getElementById('err_client').style.display = 'block'; valid = false; }
  else { document.getElementById('err_client').style.display = 'none'; }
  if(!title){ document.getElementById('err_title').style.display = 'block'; valid = false; }
  else { document.getElementById('err_title').style.display = 'none'; }
  if(!valid) return;

  const data = {
    client,
    title,
    category: document.getElementById('f_category').value,
    priority: document.getElementById('f_priority').value,
    owner: document.getElementById('f_owner').value.trim(),
    due: document.getElementById('f_due').value,
    status: document.getElementById('f_status').value,
  };

  if(editingId){
    const t = tickets.find(x=>x.id===editingId);
    Object.assign(t, data);
  } else {
    tickets.push({ id: uid(), createdAt: Date.now(), ...data });
  }
  await saveTickets();
  closeModal();
  render();
});

['searchInput','statusFilter','priorityFilter','categoryFilter','sortBy'].forEach(id=>{
  document.getElementById(id).addEventListener('input', render);
  document.getElementById(id).addEventListener('change', render);
});

loadTickets();
</script>
</body>
</html>
